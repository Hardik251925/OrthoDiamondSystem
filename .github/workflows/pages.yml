# Builds the Doctor Web App (FE/web) as a static site and publishes it to GitHub Pages.
# Public URL: https://<owner>.github.io/<repo>/
# Set repository variable API_BASE (Settings > Secrets and variables > Actions > Variables) to the public
# backend URL, e.g. https://<ngrok-domain>. Without it the site shows "server not reachable" for live data.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["FE/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/web/package-lock.json
      - run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
        run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FE/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
