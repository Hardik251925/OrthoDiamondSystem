# Ortho Diamond infrastructure. Backend (BE) and web (FE/web) run on the host.
# This PC has no Docker yet: native PostgreSQL + scripts/gateway.mjs are used instead (see docs/PROGRESS.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ortho_diamond
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  caddy:
    image: caddy:2
    ports:
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./FE/admin/dist:/srv/admin:ro

volumes:
  pgdata:
  redisdata:
  ollamadata:
